<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>SSH Monitor - Realtime</title>
  <style>
    body { font-family: Arial, sans-serif; background:#121212; color:#eee; padding:16px; }
    table { width:100%; border-collapse:collapse; margin-bottom:16px; background:#1e1e1e; }
    th, td { padding:8px; border:1px solid #333; text-align:center; }
    th { background:#0b1220; }
    .blocked { color:#ff6b6b; font-weight:bold; }
    .open { color:#7bed9f; font-weight:bold; }
    button { padding:6px 10px; border:none; border-radius:4px; cursor:pointer; }
    .block { background:#c0392b; color:white; }
    .unblock { background:#16a085; color:white; }
    #status { margin-bottom:8px; }
  </style>
</head>
<body>

<h1>SSH Monitor — Realtime</h1>
<div id="status">Connecting...</div>

<h2>IP Status</h2>
<table>
  <thead><tr><th>IP</th><th>Status</th><th>Action</th></tr></thead>
  <tbody id="ip-table"></tbody>
</table>

<h2>Recent Logs</h2>
<table>
  <thead><tr><th>IP</th><th>User</th><th>Status</th><th>Time</th></tr></thead>
  <tbody id="logs-table"></tbody>
</table>

<script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
<script>
  window.OneSignalDeferred = window.OneSignalDeferred || [];
  OneSignalDeferred.push(async function (OneSignal) {
    await OneSignal.init({
        appId: "1cf92b1f-e920-43b2-b3d5-c3845a748ad3",
    });

    const permission = await OneSignal.Notifications.requestPermission();

    await OneSignal.login("user123"); 

    const pushId = await OneSignal.User.PushSubscription.id;
    console.log("Player ID:", pushId);
  });
</script>

<script>
const API = "http://10.20.150.243:8000"; 
const ipTable = document.getElementById('ip-table');
const logsTable = document.getElementById('logs-table');
const statusDiv = document.getElementById('status');

function createCell(text, cls = '') {
  const td = document.createElement('td');
  td.textContent = text;
  if (cls) td.className = cls;
  return td;
}

function addLogRow(log) {
  const tr = document.createElement('tr');
  tr.appendChild(createCell(log.ip));
  tr.appendChild(createCell(log.user));
  tr.appendChild(createCell(log.status, log.status === 'failed' ? 'blocked' : 'open'));
  tr.appendChild(createCell(log.timestamp));
  // tr.appendChild(createCell(log.is_blocked ? 'YES' : 'NO'));
  logsTable.prepend(tr);
  // limit rows
  while (logsTable.children.length > 200) logsTable.removeChild(logsTable.lastChild);
}

function updateIpTable(rows) {
  ipTable.innerHTML = '';
  rows.forEach(r => {
    const tr = document.createElement('tr');
    tr.appendChild(createCell(r.ip));
    tr.appendChild(createCell(r.is_blocked ? 'BLOCKED' : 'OPEN', r.is_blocked ? 'blocked' : 'open'));
    const actionTd = document.createElement('td');
    const btn = document.createElement('button');
    if (r.is_blocked) {
      btn.textContent = 'UNBLOCK';
      btn.className = 'unblock';
      btn.onclick = () => optimisticUnblock(r.ip);
    } else {
      btn.textContent = 'BLOCK';
      btn.className = 'block';
      btn.onclick = () => optimisticBlock(r.ip);
    }
    actionTd.appendChild(btn);
    tr.appendChild(actionTd);
    ipTable.appendChild(tr);
  });
}

function optimisticBlock(ip) {
  const rows = [...ipTable.children];
  rows.forEach(tr => {
    if (tr.children[0].innerText === ip) {
      tr.children[1].innerText = 'BLOCKED';
      tr.children[1].className = 'blocked';
      tr.children[2].innerHTML = '<button class="unblock" onclick="optimisticUnblock(\''+ip+'\')">UNBLOCK</button>';
    }
  });
  fetch(`${API}/block/${ip}`, { method: 'POST' }).catch(e => console.error(e));
}

function optimisticUnblock(ip) {
  const rows = [...ipTable.children];
  rows.forEach(tr => {
    if (tr.children[0].innerText === ip) {
      tr.children[1].innerText = 'OPEN';
      tr.children[1].className = 'open';
      tr.children[2].innerHTML = '<button class="block" onclick="optimisticBlock(\''+ip+'\')">BLOCK</button>';
    }
  });
  fetch(`${API}/unblock/${ip}`, { method: 'POST' }).catch(e => console.error(e));
}

fetch(`${API}/ip-status`).then(r => r.json()).then(updateIpTable).catch(e => console.error(e));
fetch(`${API}/logs`).then(r => r.json()).then(d => { d.data.reverse().forEach(addLogRow); }).catch(e => console.error(e));

const es = new EventSource(`${API}/stream`);
es.onopen = () => { statusDiv.innerText = 'Connected (SSE)'; };
es.onerror = () => { statusDiv.innerText = 'Disconnected — trying to reconnect...'; };
es.onmessage = (ev) => {
  try {
    const payload = JSON.parse(ev.data);
    if (payload.type === 'log') {
      addLogRow(payload.data);
    } else if (payload.type === 'ip_status') {
      updateIpTable(payload.data);
    } else if (payload.type === 'system') {
      console.log('SYSTEM:', payload.data.message);
    }
  } catch (err) {
    console.error('parse sse', err);
  }
};
</script>

</body>
</html>
