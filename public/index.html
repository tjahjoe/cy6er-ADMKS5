<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SSH Login Monitor</title>
    <style>
        body { font-family: Arial; padding:20px; background:#f5f5f5; }
        h1 { color:#333; }
        table {
            width:100%; border-collapse:collapse; background:white;
            box-shadow:0 2px 5px rgba(0,0,0,0.1); margin-top:20px;
        }
        th { background:#333; color:white; padding:10px; }
        td { padding:10px; border-bottom:1px solid #ddd; }
        tr:hover { background:#f0f0f0; }
        .success { color:green; }
        .failed { color:red; }
        button { padding:5px 10px; cursor:pointer; border:none; border-radius:4px; }
        .block-btn { background:#d9534f; color:white; }
        .unblock-btn { background:#5cb85c; color:white; }
    </style>
</head>
<body>

<h1>SSH Login Monitor (Realtime)</h1>
<p id="status">Status: <span style="color:blue">Connecting...</span></p>

<h2>IP Status (Blocked / Allowed)</h2>
<table>
    <thead>
        <tr>
            <th>IP</th>
            <th>Status</th>
            <th>Aksi</th>
        </tr>
    </thead>
    <tbody id="ipTableBody"></tbody>
</table>

<h2>Realtime SSH Logs</h2>
<table>
    <thead>
        <tr>
            <th>IP Address</th>
            <th>User</th>
            <th>Status</th>
            <th>Timestamp</th>
        </tr>
    </thead>
    <tbody id="logTableBody"></tbody>
</table>

<script>

function renderLogRow(log) {
    return `
        <tr>
            <td>${log.ip}</td>
            <td>${log.user}</td>
            <td class="${log.status}">${log.status}</td>
            <td>${log.timestamp}</td>
        </tr>
    `;
}

function renderIPRow(item) {
    let status = item.is_blocked == 1 ? "BLOCKED" : "ALLOWED";
    let color = item.is_blocked == 1 ? "red" : "green";

    let button = item.is_blocked == 1
        ? `<button class="unblock-btn" onclick="unblockIP('${item.ip}')">Unblock</button>`
        : `<button class="block-btn" onclick="blockIP('${item.ip}')">Block</button>`;

    return `
        <tr>
            <td>${item.ip}</td>
            <td style="color:${color};font-weight:bold">${status}</td>
            <td>${button}</td>
        </tr>
    `;
}

async function loadInitialLogs() {
    const res = await fetch("http://127.0.0.1:8000/logs");
    const json = await res.json();

    const tbody = document.getElementById("logTableBody");
    tbody.innerHTML = "";

    json.data.forEach(log => {
        tbody.innerHTML += renderLogRow(log);
    });
}

async function loadIPStatus() {
    const res = await fetch("http://127.0.0.1:8000/ip-status");
    const data = await res.json();

    const tbody = document.getElementById("ipTableBody");
    tbody.innerHTML = "";

    data.forEach(item => {
        tbody.innerHTML += renderIPRow(item);
    });
}

async function blockIP(ip) {
    await fetch(`http://127.0.0.1:8000/block/${ip}`, { method: "POST" });
    loadIPStatus();
}

async function unblockIP(ip) {
    await fetch(`http://127.0.0.1:8000/unblock/${ip}`, { method: "POST" });
    loadIPStatus();
}

function startEventStream() {

    const evtSource = new EventSource("http://127.0.0.1:8000/stream");

    const status = document.getElementById("status");

    evtSource.onopen = () => {
        status.innerHTML = 'Status: <span style="color:green">Connected (Live)</span>';
    };

    evtSource.onerror = () => {
        status.innerHTML = 'Status: <span style="color:red">Disconnected</span>';
    };

    evtSource.onmessage = (event) => {
        const data = JSON.parse(event.data);

        const tbody = document.getElementById("logTableBody");
        tbody.innerHTML = renderLogRow(data) + tbody.innerHTML;

        loadIPStatus(); 
    };
}

loadInitialLogs();
loadIPStatus();
startEventStream();

</script>

</body>
</html>
