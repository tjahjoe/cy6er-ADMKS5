<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SSH Login Monitor</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background: #f5f5f5;
        }
        h1 {
            color: #333;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            margin-top: 20px;
        }
        th {
            background: #333;
            color: white;
            padding: 10px;
        }
        td {
            padding: 10px;
            border-bottom: 1px solid #ddd;
        }
        tr:hover {
            background: #f0f0f0;
        }
        #status {
            margin-top: 10px;
            font-weight: bold;
        }
        .success { color: green; }
        .failed { color: red; }
    </style>
</head>
<body>

<h1>SSH Login Monitor (Realtime)</h1>
<p id="status">Status: <span style="color:blue">Connecting...</span></p>

<table>
    <thead>
        <tr>
            <th>IP Address</th>
            <th>User</th>
            <th>Status</th>
            <th>Timestamp</th>
        </tr>
    </thead>
    <tbody id="logTableBody"></tbody>
</table>

<script>

// === Fungsi Render Tabel ===
function renderRow(log) {
    return `
        <tr>
            <td>${log.ip}</td>
            <td>${log.user}</td>
            <td class="${log.status}">${log.status}</td>
            <td>${log.timestamp}</td>
        </tr>
    `;
}

// === Load Data Awal (GET /logs) ===
async function loadInitialLogs() {
    const res = await fetch("http://127.0.0.1:8000/logs");
    const json = await res.json();

    const tbody = document.getElementById("logTableBody");
    tbody.innerHTML = "";

    json.data.forEach(log => {
        tbody.innerHTML += renderRow(log);
    });
}


// === Live Update via SSE (GET /stream) ===
function startEventStream() {

    const evtSource = new EventSource("http://127.0.0.1:8000/stream");

    const status = document.getElementById("status");

    evtSource.onopen = () => {
        status.innerHTML = 'Status: <span style="color:green">Connected (Live)</span>';
    };

    evtSource.onerror = () => {
        status.innerHTML = 'Status: <span style="color:red">Disconnected</span>';
    };

    evtSource.onmessage = (event) => {
        const data = JSON.parse(event.data);
        console.log("Realtime log:", data);

        const tbody = document.getElementById("logTableBody");
        tbody.innerHTML = renderRow(data) + tbody.innerHTML;
    };
}


// === MAIN START ===
loadInitialLogs();
startEventStream();

</script>

</body>
</html>
